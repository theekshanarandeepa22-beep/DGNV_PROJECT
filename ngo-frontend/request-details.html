<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Request Details | DGNV NGO</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body>
  <div class="app-shell">
    <aside id="sidebar" class="sidebar">
      <div class="sidebar-brand"><img src="assets/logo.png" class="sidebar-logo" alt="DGNV"><div><p class="sidebar-title">DGNV NGO</p><p class="sidebar-subtitle">Response Console</p></div></div>
      <nav class="sidebar-nav">
        <a class="sidebar-link" href="dashboard.html"><i class="bi bi-speedometer2"></i> Dashboard</a>
        <a class="sidebar-link" href="requests.html"><i class="bi bi-inboxes"></i> Requests</a>
        <a class="sidebar-link" href="volunteers.html"><i class="bi bi-people"></i> Volunteers</a>
        <a class="sidebar-link" href="tasks.html"><i class="bi bi-list-check"></i> Tasks</a>
        <a class="sidebar-link" href="profile.html"><i class="bi bi-person-circle"></i> Profile</a>
        <a class="sidebar-link" href="change-password.html"><i class="bi bi-shield-lock"></i> Password</a>
      </nav>
    </aside>
    <div id="sidebarBackdrop" class="sidebar-backdrop"></div>
    <main class="main-area">
      <header class="topbar">
        <div class="d-flex align-items-center gap-3">
          <button id="sidebarToggle" class="btn btn-outline-primary d-lg-none"><i class="bi bi-list"></i></button>
          <div><h1 id="detailTitle" class="page-title">Request Details</h1><p class="page-subtitle">Review details and assign volunteer</p></div>
        </div>
        <a href="requests.html" class="btn btn-outline-primary"><i class="bi bi-arrow-left me-1"></i> Requests</a>
      </header>
      <section class="content">
        <div class="row g-4">
          <div class="col-xl-8">
            <div class="panel">
              <div class="d-flex justify-content-between align-items-center mb-3">
                <h2 class="h6 mb-0">Complete Request Details</h2>
                <div id="detailStatus"></div>
              </div>
              <div id="detailsGrid" class="detail-grid"></div>
            </div>
          </div>
          <div class="col-xl-4">
            <div class="panel">
              <h2 class="h6 mb-3">Assign Volunteer</h2>
              <label class="form-label" for="volunteerSelect">Available Volunteer</label>
              <select id="volunteerSelect" class="form-select mb-3"></select>
              <button id="assignVolunteerBtn" class="btn btn-primary w-100"><i class="bi bi-person-check me-1"></i> Assign</button>
              <div id="assignedVolunteer" class="mt-3"></div>
            </div>
          </div>
        </div>
      </section>
    </main>
  </div>
  <div id="spinnerOverlay" class="spinner-overlay"><div class="spinner-border text-primary" role="status"></div></div>
  <div id="toastContainer" class="toast-container position-fixed top-0 end-0 p-3"></div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/axios@1.7.9/dist/axios.min.js"></script>
  <script src="js/api.js"></script><script src="js/auth.js"></script><script src="js/request-details.js"></script>
</body>
</html>
