<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Change Password | DGNV NGO</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body>
  <div class="app-shell">
    <aside id="sidebar" class="sidebar">
      <div class="sidebar-brand"><img src="assets/logo.png" class="sidebar-logo" alt="DGNV"><div><p class="sidebar-title">DGNV NGO</p><p class="sidebar-subtitle">Response Console</p></div></div>
      <nav class="sidebar-nav">
        <a class="sidebar-link" href="dashboard.html"><i class="bi bi-speedometer2"></i> Dashboard</a>
        <a class="sidebar-link" href="requests.html"><i class="bi bi-inboxes"></i> Requests</a>
        <a class="sidebar-link" href="volunteers.html"><i class="bi bi-people"></i> Volunteers</a>
        <a class="sidebar-link" href="tasks.html"><i class="bi bi-list-check"></i> Tasks</a>
        <a class="sidebar-link" href="profile.html"><i class="bi bi-person-circle"></i> Profile</a>
        <a class="sidebar-link" href="change-password.html"><i class="bi bi-shield-lock"></i> Password</a>
      </nav>
    </aside>
    <div id="sidebarBackdrop" class="sidebar-backdrop"></div>
    <main class="main-area">
      <header class="topbar">
        <div class="d-flex align-items-center gap-3"><button id="sidebarToggle" class="btn btn-outline-primary d-lg-none"><i class="bi bi-list"></i></button><div><h1 class="page-title">Change Password</h1><p class="page-subtitle">Password update requires a backend endpoint</p></div></div>
        <a href="profile.html" class="btn btn-outline-primary"><i class="bi bi-arrow-left me-1"></i> Profile</a>
      </header>
      <section class="content">
        <div class="panel" style="max-width: 620px;">
          <h2 class="h6 mb-3">Password</h2>
          <form id="passwordForm">
            <div class="mb-3"><label class="form-label">Current Password</label><input class="form-control" type="password" required></div>
            <div class="mb-3"><label class="form-label">New Password</label><input class="form-control" type="password" minlength="6" required></div>
            <div class="mb-4"><label class="form-label">Confirm New Password</label><input class="form-control" type="password" minlength="6" required></div>
            <button class="btn btn-primary" type="submit"><i class="bi bi-shield-check me-1"></i> Update Password</button>
          </form>
        </div>
      </section>
    </main>
  </div>
  <div id="spinnerOverlay" class="spinner-overlay"><div class="spinner-border text-primary" role="status"></div></div>
  <div id="toastContainer" class="toast-container position-fixed top-0 end-0 p-3"></div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/axios@1.7.9/dist/axios.min.js"></script>
  <script src="js/api.js"></script><script src="js/auth.js"></script><script src="js/profile.js"></script>
</body>
</html>
