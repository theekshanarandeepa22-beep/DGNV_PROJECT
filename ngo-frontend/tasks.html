<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tasks | DGNV NGO</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body>
  <div class="app-shell">
    <aside id="sidebar" class="sidebar">
      <div class="sidebar-brand"><img src="assets/logo.png" class="sidebar-logo" alt="DGNV"><div><p class="sidebar-title">DGNV NGO</p><p class="sidebar-subtitle">Response Console</p></div></div>
      <nav class="sidebar-nav">
        <a class="sidebar-link" href="dashboard.html"><i class="bi bi-speedometer2"></i> Dashboard</a>
        <a class="sidebar-link" href="requests.html"><i class="bi bi-inboxes"></i> Requests</a>
        <a class="sidebar-link" href="volunteers.html"><i class="bi bi-people"></i> Volunteers</a>
        <a class="sidebar-link" href="tasks.html"><i class="bi bi-list-check"></i> Tasks</a>
        <a class="sidebar-link" href="profile.html"><i class="bi bi-person-circle"></i> Profile</a>
        <a class="sidebar-link" href="change-password.html"><i class="bi bi-shield-lock"></i> Password</a>
      </nav>
    </aside>
    <div id="sidebarBackdrop" class="sidebar-backdrop"></div>
    <main class="main-area">
      <header class="topbar">
        <div class="d-flex align-items-center gap-3">
          <button id="sidebarToggle" class="btn btn-outline-primary d-lg-none"><i class="bi bi-list"></i></button>
          <div><h1 class="page-title">Tasks</h1><p class="page-subtitle">Track volunteer response progress</p></div>
        </div>
        <button id="taskRefreshBtn" class="btn btn-primary"><i class="bi bi-arrow-clockwise me-1"></i> Refresh</button>
      </header>
      <section class="content">
        <div class="table-panel">
          <div class="table-toolbar">
            <div><h2 class="h6 mb-1">Task Queue</h2><span id="taskCount" class="text-secondary small">0 tasks</span></div>
            <input id="taskSearch" class="form-control form-control-sm" type="search" placeholder="Search tasks" style="max-width: 280px;">
          </div>
          <div class="table-responsive">
            <table class="table table-hover">
              <thead><tr><th>ID</th><th>Request</th><th>Volunteer</th><th>Category</th><th>Priority</th><th>District</th><th>Status</th><th>Assigned</th><th>Actions</th></tr></thead>
              <tbody id="tasksBody"></tbody>
            </table>
          </div>
          <div class="d-flex justify-content-end p-3" id="tasksPagination"></div>
        </div>
      </section>
    </main>
  </div>
  <div id="spinnerOverlay" class="spinner-overlay"><div class="spinner-border text-primary" role="status"></div></div>
  <div id="toastContainer" class="toast-container position-fixed top-0 end-0 p-3"></div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/axios@1.7.9/dist/axios.min.js"></script>
  <script src="js/api.js"></script><script src="js/auth.js"></script><script src="js/tasks.js"></script>
</body>
</html>
