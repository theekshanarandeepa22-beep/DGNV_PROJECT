<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Profile | DGNV NGO</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body>
  <div class="app-shell">
    <aside id="sidebar" class="sidebar">
      <div class="sidebar-brand"><img src="assets/logo.png" class="sidebar-logo" alt="DGNV"><div><p class="sidebar-title">DGNV NGO</p><p class="sidebar-subtitle">Response Console</p></div></div>
      <nav class="sidebar-nav">
        <a class="sidebar-link" href="dashboard.html"><i class="bi bi-speedometer2"></i> Dashboard</a>
        <a class="sidebar-link" href="requests.html"><i class="bi bi-inboxes"></i> Requests</a>
        <a class="sidebar-link" href="volunteers.html"><i class="bi bi-people"></i> Volunteers</a>
        <a class="sidebar-link" href="tasks.html"><i class="bi bi-list-check"></i> Tasks</a>
        <a class="sidebar-link" href="profile.html"><i class="bi bi-person-circle"></i> Profile</a>
        <a class="sidebar-link" href="change-password.html"><i class="bi bi-shield-lock"></i> Password</a>
      </nav>
    </aside>
    <div id="sidebarBackdrop" class="sidebar-backdrop"></div>
    <main class="main-area">
      <header class="topbar">
        <div class="d-flex align-items-center gap-3"><button id="sidebarToggle" class="btn btn-outline-primary d-lg-none"><i class="bi bi-list"></i></button><div><h1 class="page-title">Profile</h1><p class="page-subtitle">Local NGO admin profile settings</p></div></div>
        <button class="btn btn-outline-danger" data-logout><i class="bi bi-box-arrow-right me-1"></i> Logout</button>
      </header>
      <section class="content">
        <div class="row g-4">
          <div class="col-xl-7">
            <div class="panel">
              <h2 class="h6 mb-3">Edit Profile</h2>
              <form id="profileForm">
                <div class="row g-3">
                  <div class="col-md-6"><label class="form-label">Name</label><input id="profileName" class="form-control" required></div>
                  <div class="col-md-6"><label class="form-label">Email</label><input id="profileEmail" class="form-control" type="email" required></div>
                  <div class="col-md-6"><label class="form-label">Phone</label><input id="profilePhone" class="form-control"></div>
                  <div class="col-md-6"><label class="form-label">District</label><input id="profileDistrict" class="form-control"></div>
                </div>
                <button class="btn btn-primary mt-4" type="submit"><i class="bi bi-save me-1"></i> Save Profile</button>
              </form>
            </div>
          </div>
          <div class="col-xl-5">
            <div class="panel">
              <h2 class="h6 mb-3">Account</h2>
              <div class="detail-grid">
                <div class="detail-item"><div class="detail-label">Role</div><div id="profileRole" class="detail-value"></div></div>
                <div class="detail-item"><div class="detail-label">Last Login</div><div id="profileLoginAt" class="detail-value"></div></div>
              </div>
              <a href="change-password.html" class="btn btn-outline-primary mt-3"><i class="bi bi-shield-lock me-1"></i> Change Password</a>
            </div>
          </div>
        </div>
      </section>
    </main>
  </div>
  <div id="spinnerOverlay" class="spinner-overlay"><div class="spinner-border text-primary" role="status"></div></div>
  <div id="toastContainer" class="toast-container position-fixed top-0 end-0 p-3"></div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/axios@1.7.9/dist/axios.min.js"></script>
  <script src="js/api.js"></script><script src="js/auth.js"></script><script src="js/profile.js"></script>
</body>
</html>
