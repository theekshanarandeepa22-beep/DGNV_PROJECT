<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Register NGO | DGNV</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body class="auth-body">
  <main class="auth-card p-4 p-md-5">
    <div class="text-center mb-4">
      <img src="assets/logo.png" class="auth-logo mb-3" alt="DGNV">
      <h1 class="h4 fw-bold mb-1">NGO Registration</h1>
      <p class="text-secondary mb-0">Create your DGNV NGO admin account</p>
    </div>

    <form id="registerForm" class="needs-validation">
      <div class="mb-3">
        <label class="form-label" for="ngoName">NGO Name</label>
        <div class="input-group">
          <span class="input-group-text"><i class="bi bi-building"></i></span>
          <input type="text" class="form-control" id="ngoName" name="ngoName" required>
        </div>
      </div>

      <div class="mb-3">
        <label class="form-label" for="email">Email</label>
        <div class="input-group">
          <span class="input-group-text"><i class="bi bi-envelope"></i></span>
          <input type="email" class="form-control" id="email" name="email" required>
        </div>
      </div>

      <div class="mb-3">
        <label class="form-label" for="password">Password</label>
        <div class="input-group">
          <span class="input-group-text"><i class="bi bi-lock"></i></span>
          <input type="password" class="form-control" id="password" name="password" minlength="6" required>
        </div>
      </div>

      <div class="mb-3">
        <label class="form-label" for="phone">Phone Number</label>
        <div class="input-group">
          <span class="input-group-text"><i class="bi bi-telephone"></i></span>
          <input type="tel" class="form-control" id="phone" name="phone" required>
        </div>
      </div>

      <div class="mb-3">
        <label class="form-label" for="district">District</label>
        <div class="input-group">
          <span class="input-group-text"><i class="bi bi-geo-alt"></i></span>
          <input type="text" class="form-control" id="district" name="district" required>
        </div>
      </div>

      <div class="mb-4">
        <label class="form-label" for="categories">Categories</label>
        <select class="form-select" id="categories" name="categories" multiple required>
          <option value="Food Support">Food Support</option>
          <option value="Water Supply">Water Supply</option>
          <option value="Medical Assistance">Medical Assistance</option>
          <option value="Temporary Shelter">Temporary Shelter</option>
          <option value="Rescue Services">Rescue Services</option>
          <option value="Clothing Support">Clothing Support</option>
          <option value="Electricity Support">Electricity Support</option>
          <option value="Security Support">Security Support</option>
          <option value="Boat Service">Boat Service</option>
          <option value="Housing Repair">Housing Repair</option>
        </select>
      </div>

      <button type="submit" class="btn btn-primary w-100">
        <i class="bi bi-person-plus me-1"></i> Register
      </button>
    </form>

    <p class="text-center text-secondary mt-4 mb-0">
      Already registered? <a href="login.html">Login</a>
    </p>
  </main>

  <div id="spinnerOverlay" class="spinner-overlay">
    <div class="spinner-border text-primary" role="status"></div>
  </div>
  <div id="toastContainer" class="toast-container position-fixed top-0 end-0 p-3"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/axios@1.7.9/dist/axios.min.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/register.js"></script>
</body>
</html>
