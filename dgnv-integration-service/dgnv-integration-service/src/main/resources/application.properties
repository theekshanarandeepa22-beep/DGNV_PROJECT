spring.application.name=INTEGRATION-SERVICE

server.port=9100

# ==========================
# DATABASE
# ==========================
spring.datasource.url=jdbc:mysql://localhost:3306/integration_db
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ==========================
# JPA
# ==========================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ==========================
# EUREKA CLIENT
# ==========================
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

eureka.instance.prefer-ip-address=true

management.endpoints.web.exposure.include=*

# ==========================
# EXTERNAL SERVICE REST URLS
# ==========================
dgnv.services.government-request.base-url=http://localhost:6003
dgnv.services.ngo-request.base-url=http://localhost:9203
